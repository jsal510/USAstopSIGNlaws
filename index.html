<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USA Stop Sign Laws</title>

  <style>
    html, body, h1, h1 *, label, label *, select, option, strong,
    .section, .label, .value, .stop-header, #stateHeader {
      font-family: "Gotham", "Montserrat", Arial, sans-serif !important;
      font-weight: bold !important;
    }

    body {
      max-width: 900px;
      margin: 10px auto;
      padding: 8px;
      line-height: 1.25;
      background: #000;
      color: #333;
    }

    h1 {
      text-align: center;
      color: #fff;
      font-size: 1.2em;
      margin: 12px 0 14px;
    }

    .dropdown-container {
      text-align: center;
      margin: 0 0 16px;
    }

    select {
      width: 90%;
      max-width: 650px;
      padding: 12px 14px;
      font-size: .72em;
      border-radius: 12px;
      border: 2px solid #222;
      background: white;
      color: #222;
      box-sizing: border-box;
    }

    option {
      font-size: .85em;
    }

    #result {
      background: white;
      padding: 12px;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      display: none;
    }

    #stateHeader {
      font-size: 1.15em;
      margin-bottom: 10px;
      color: #0066cc;
      border-bottom: 3px solid #0066cc;
      padding-bottom: 7px;
    }

    #stateHeader span.pop {
      font-size: 0.5em;
      color: #444;
    }

    .section {
      margin: 9px 0;
    }

    .label {
      font-size: .76em;
      color: #333;
      display: block;
      margin-bottom: 4px;
    }

    .value {
      display: block;
      background: #0a78c8;
      color: white;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: .72em;
      line-height: 1.3;
      font-style: italic;
    }

    .stop-header {
      font-size: .92em;
      text-transform: uppercase;
      margin: 11px 0 6px;
      color: #222;
      display: block;
    }

    .condition-label {
      font-size: .76em;
      color: #333;
      display: block;
      margin: 10px 0 4px;
    }

    .divider {
      height: 3px;
      background: #0066cc;
      margin: 11px 0 9px;
      border: none;
    }

    .exact-wording {
      margin-top: 10px;
    }

    .exact-wording .value {
      font-size: .7em;
      line-height: 1.25;
      font-style: normal;
      padding: 7px 9px;
    }

    @media (max-width: 768px) {
      body {
        padding: 7px;
      }

      h1 {
        font-size: 1.15em;
        margin-bottom: 12px;
      }

      select {
        width: 94%;
        font-size: .68em;
        padding: 11px 12px;
      }

      option {
        font-size: .82em;
      }

      #result {
        padding: 11px;
      }

      .value {
        font-size: .76em;
        padding: 8px 9px;
      }

      .exact-wording .value {
        font-size: .58em;
        line-height: 1.23;
      }
    }
  </style>
</head>

<body>

  <h1>USA Stop Sign Laws</h1>

  <div class="dropdown-container">
    <select id="stateSelect">
      <option value="">Select a State</option>
    </select>
  </div>

  <div id="result">

    <div id="stateHeader"></div>

    <div class="section">
      <span class="label">STATUTE:</span>
      <span class="value" id="statuteName"></span>
    </div>

    <hr class="divider">

    <div class="section">
      <span class="stop-header">STOP LOCATION:</span>
    </div>

    <div class="section">
      <span class="label">1. Painted Stop Line:</span>
      <span class="value" id="paintedLine"></span>
    </div>

    <div class="section">
      <span class="label">2. Crosswalk:</span>
      <span class="value" id="crosswalk"></span>
    </div>

    <div class="section">
      <span class="condition-label">*If No Painted Stop Line or Crosswalk</span>
      <span class="label">3. Stop Sign Only:</span>
      <span class="value" id="noLine"></span>
    </div>

    <div class="section exact-wording">
      <span class="label">Exact Wording:</span>
      <span class="value" id="exactWording"></span>
    </div>

  </div>

  <script>
    const CSV_URL =
      'https://docs.google.com/spreadsheets/d/e/2PACX-1vQo8C9BcTbj974aAidWJoxLe9MWsIy2a0jHo16FnUMhSak8yGx0qRAYiEc85QB043UJV6uBBJ4KNMNc/pub?gid=425856129&single=true&output=csv';

    let data = [];

    function parseCSV(text) {
      const rows = [];
      let row = [];
      let field = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
          if (inQuotes && nextChar === '"') {
            field += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === ',' && !inQuotes) {
          row.push(field.trim());
          field = '';
        } else if ((char === '\n' || char === '\r') && !inQuotes) {
          if (char === '\r' && nextChar === '\n') {
            i++;
          }

          row.push(field.trim());

          if (row.some(cell => cell !== '')) {
            rows.push(row);
          }

          row = [];
          field = '';
        } else {
          field += char;
        }
      }

      row.push(field.trim());

      if (row.some(cell => cell !== '')) {
        rows.push(row);
      }

      return rows;
    }

    fetch(CSV_URL)
      .then(response => response.text())
      .then(text => {
        data = parseCSV(text)
          .filter(row => row.length >= 9 && row[3]);

        data.sort((a, b) =>
          a[3].localeCompare(b[3])
        );

        const select = document.getElementById('stateSelect');

        data.forEach((row, index) => {
          const option = document.createElement('option');
          option.value = index;
          option.textContent = row[3];
          select.appendChild(option);
        });
      });

    document
      .getElementById('stateSelect')
      .addEventListener('change', function() {

        const index = this.value;

        if (index === '') {
          return;
        }

        const row = data[index];

        document.getElementById('stateHeader').innerHTML =
          row[3] +
          ' <span class="pop">' +
          row[2] +
          '</span>';

        document.getElementById('statuteName').textContent =
          row[4] || 'Not specified';

        document.getElementById('exactWording').textContent =
          row[5] || 'Not specified';

        document.getElementById('paintedLine').textContent =
          row[6] || 'Not specified';

        document.getElementById('crosswalk').textContent =
          row[7] || 'Not specified';

        document.getElementById('noLine').textContent =
          row[8] || 'Not specified';

        document.getElementById('result').style.display = 'block';

        this.value = '';
      });
  </script>

</body>
</html>
